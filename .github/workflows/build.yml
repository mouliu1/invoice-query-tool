name: 构建 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PyInstaller 打包
        run: pyinstaller "数金数据查询工具.spec" --noconfirm --clean

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: 数金数据查询工具
          path: dist/数金数据查询工具.exe
          if-no-files-found: error
